name: AuraRadio
options:
  bundleIdPrefix: com.auraradio
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "2.10.1"
    CURRENT_PROJECT_VERSION: "13"
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: NO
targets:
  AuraRadio:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: AuraRadio
        excludes:
          - "**/*.md"
    resources:
      - path: AuraRadio/Resources
    info:
      path: AuraRadio/Info.plist
    dependencies:
      - sdk: libsqlite3.tbd
      - sdk: AVFoundation.framework
      - sdk: MediaPlayer.framework
      - sdk: CarPlay.framework
      - sdk: Network.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.auraradio.app
        INFOPLIST_FILE: AuraRadio/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
